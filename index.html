<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Garbage Plates - AR</title>

  <!-- A-Frame & AR.js -->
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

  <!-- Gesture scripts -->
  <script src="https://cdn.jsdelivr.net/gh/donmccurdy/aframe-extras@6.1.1/dist/aframe-extras.min.js"></script>
  <script src="https://unpkg.com/aframe-gesture-detector@^3.3.0/dist/aframe-gesture-detector.min.js"></script>

  <style>
    #videoPopup {
      width: 100%;
      max-width: 600px;
      box-sizing: border-box;
      padding: 10px;
    }

    #gbVideo {
      width: 100%;
      height: auto;
    }

    @keyframes pulse {
      0% {
        transform: translateX(-50%) scale(1);
      }

      50% {
        transform: translateX(-50%) scale(1.1);
      }

      100% {
        transform: translateX(-50%) scale(1);
      }
    }

    #watchBtn {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background-color: #ff4500;
      color: white;
      font-size: 16px;
      padding: 12px 20px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-family: sans-serif;
      z-index: 999;
      animation: pulse 2s infinite;
    }
  </style>
</head>

<body style="margin: 0; overflow: hidden;">

  <!-- AR Scene -->
  <a-scene embedded arjs vr-mode-ui="enabled: false" renderer="antialias: true; alpha: true" cursor="rayOrigin: mouse">

    <!-- look at script -->
    <script src="https://unpkg.com/aframe-look-at-component@0.8.0/dist/aframe-look-at-component.min.js"></script>


    <!-- Lighting -->
    <a-entity light="type: ambient; intensity: 1"></a-entity>
    <a-entity light="type: directional; intensity: 0.5" position="0 1 1"></a-entity>

    <!-- Marker with model and text container -->
    <a-marker type="pattern" url="./assets/gbMarker.patt">
      <!-- Garbage Plate (scaled down and lowered) -->
      <a-entity id="gbPlate" gltf-model="./assets/gbPlate.gltf" scale="0.6 0.6 0.6" position="0 2 0" rotation="-45 0 0"
        gesture-detector gesture-handler>
      </a-entity>

      <!-- Text container (placed above the plate) -->
      <a-entity id="text-container" position="0 5 -1.8"></a-entity>

      <!-- Ingredient models (positioned behind and above the plate, facing the camera) -->
      <a-text id="labelMac" value="Mac Salad" position="-1.5 5.6 -1.5" look-at="[camera]" color="white" width="2"
        visible="false"></a-text>
      <a-entity id="gbMac" gltf-model="./assets/single_cooked_macaroni/mac.gltf" scale="18.7 18.7 18.7"
        position="-1.5 4.75 -1.5" look-at="[camera]" visible="false"></a-entity>


      <a-text id="labelBurg" value="Burger" position="0 4.8 -1.5" look-at="[camera]" color="white" width="2"
        visible="false"></a-text>
      <a-entity id="gbBurg" gltf-model="./assets/burger/burger.gltf" scale="1.4 1.4 1.4" position="0 4.85 -1.5"
        look-at="[camera]" visible="false"></a-entity>


      <a-text id="labelFries" value="Fries" position="1.5 5.6 -1.5" look-at="[camera]" color="white" width="2"
        visible="false"></a-text>
      <a-entity id="gbFries" gltf-model="./assets/french_fries/fries.gltf" scale="0.05 0.05 0.05"
        position="1.5 4.75 -1.5" look-at="[camera]" visible="false"></a-entity>
    </a-marker>

    <!-- Camera -->
    <a-entity camera></a-entity>
  </a-scene>

  <!-- Message Box -->
  <div id="message" style="
    position: absolute;
    top: 10px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(0,0,0,0.7);
    color: white;
    padding: 10px 20px;
    border-radius: 8px;
    font-family: sans-serif;
    display: none;
    z-index: 999;">
    This is a Garbage Plate! A local delicacy from Rochester, NY!
  </div>

  <!-- Video Popup -->
  <div id="videoPopup" style="
    position: absolute;
    top: 60px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(0, 0, 0, 0.9);
    padding: 10px;
    border-radius: 10px;
    display: none;
    z-index: 999;
    text-align: center;
    max-width: 90%;
    box-sizing: border-box;">

    <button id="closeVideoBtn" style="
      background: crimson;
      color: white;
      border: none;
      padding: 6px 12px;
      margin-bottom: 8px;
      border-radius: 6px;
      cursor: pointer;
      font-family: sans-serif;
      font-size: 14px;
      width: 100%;">
      Close Video
    </button>

    <!-- Sidebar Message -->
    <div id="sidebar" style="
  position: absolute;
  right: 0;
  top: 0;
  height: 100%;
  width: 250px;
  background: rgba(0,0,0,0.85);
  color: white;
  padding: 20px;
  box-sizing: border-box;
  font-family: sans-serif;
  display: none;
  z-index: 999;">

      <h2>Ingredient</h2>
      <p id="sidebarText">Info will appear here</p>

      <!-- 🔗 Redirect Button -->
      <button id="visitBtn" onclick="window.open('https://www.originalgarbageplate.com', '_blank')" style="
    margin-top: 20px;
    padding: 10px 16px;
    font-size: 14px;
    background: #ff6347;
    color: white;
    border: none;
    border-radius: 5px;
    cursor: pointer;
    width: 100%;">
        Visit the Restaurant
      </button>

      <!-- ❌ Close Button -->
      <button onclick="document.getElementById('sidebar').style.display='none'" style="
    margin-top: 10px;
    padding: 8px 16px;
    font-size: 14px;
    background: #444;
    color: white;
    border: none;
    border-radius: 5px;
    cursor: pointer;
    width: 100%;">
        Close
      </button>
    </div>

  </div>

  <!-- Watch Video Button -->
  <button onclick="window.open('video.html', '_blank')" style="
    position: absolute;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    background-color: #ff4500;
    color: white;
    font-size: 16px;
    padding: 12px 20px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-family: sans-serif;
    z-index: 999;">
    🍳 Watch It Being Made!
  </button>

  <!-- Intro Overlay -->
  <div id="introOverlay" style="
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    background: rgba(0,0,0,0.95);
    color: white;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    padding: 20px;
    z-index: 1000;
    font-family: sans-serif;
  ">

    <h1 style="font-size: 2em; margin-bottom: 10px;">Welcome to the Garbage Plate AR Experience</h1>
    <p style="max-width: 600px; font-size: 1.1em; margin-bottom: 30px;">
      Explore Rochester’s most iconic dish in augmented reality. Tap the plate to learn more about each ingredient—and
      don’t forget to watch how it’s made!
    </p>

    <button onclick="document.getElementById('introOverlay').style.display='none'" style="
      padding: 12px 20px;
      font-size: 16px;
      background: #ff4500;
      border: none;
      border-radius: 8px;
      color: white;
      cursor: pointer;
    ">Start</button>

  </div>



  <script src="./scripts/script.js"></script>
</body>

</html>
