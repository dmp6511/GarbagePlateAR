<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Garbage Plates - AR</title>

  <!-- A-Frame & AR.js -->
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
</head>

<body style="margin: 0; overflow: hidden;">

  <!-- AR Scene -->
  <a-scene embedded arjs vr-mode-ui="enabled: false" renderer="antialias: true; alpha: true" cursor="rayOrigin: mouse">

    <!-- Lighting -->
    <a-entity light="type: ambient; intensity: 1"></a-entity>
    <a-entity light="type: directional; intensity: 0.5" position="0 1 1"></a-entity>

    <!-- Custom Marker -->
    <a-marker type="pattern" url="./assets/gbMarker.patt">
      <a-entity id="gbPlate" gltf-model="./assets/gbPlate.gltf" scale="2.5 2.5 2.5" position="0 0 0" rotation="0 -90 0">
      </a-entity>
    </a-marker>



    <!-- Camera -->
    <a-entity camera></a-entity>
  </a-scene>

  <!--   script link -->
  <script src="./scripts/script.js"></script>

  <!-- pop up for when the model is clicked -->
  <div id="message" style="
  position: absolute;
  top: 10px;
  left: 50%;
  transform: translateX(-50%);
  background: rgba(0,0,0,0.7);
  color: white;
  padding: 10px 20px;
  border-radius: 8px;
  font-family: sans-serif;
  display: none;
  z-index: 999;">
    This is a Garbage Plate! A local delicacy from Rochester, NY!
  </div>

  <!-- Youtube video of Alex Tahou ("ta-who") detailing the garbage plate -->
  <div id="videoPopup" style="
  position: absolute;
  bottom: 10px;
  left: 50%;
  transform: translateX(-50%);
  background: rgba(0, 0, 0, 0.9);
  padding: 10px;
  border-radius: 10px;
  display: none;
  z-index: 999;
  text-align: center;
  max-width: 90%;
  box-sizing: border-box;">

    <button id="closeVideoBtn" style="
    background: crimson;
    color: white;
    border: none;
    padding: 6px 12px;
    margin-bottom: 8px;
    border-radius: 6px;
    cursor: pointer;
    font-family: sans-serif;
    font-size: 14px;
    width: 100%;">
      Close Video
    </button>

    <div style="
  position: relative;
  width: 112.5%;
  max-width: 112.5%;
  padding-bottom: 70.31%;
  height: 0;
  overflow: hidden;
  border-radius: 6px;
  margin: 0 auto;">

      <iframe id="gbVideo" src="" title="Garbage Plate Explained"
        style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 0;"
        allow="autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen>
      </iframe>
    </div>

  </div>



</body>

</html>
