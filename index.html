<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Garbage Plates - AR</title>

  <!-- A-Frame & AR.js -->
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

  <!-- Gesture scripts -->
  <script src="https://cdn.jsdelivr.net/gh/donmccurdy/aframe-extras@6.1.1/dist/aframe-extras.min.js"></script>
  <script src="https://unpkg.com/aframe-gesture-detector@^3.3.0/dist/aframe-gesture-detector.min.js"></script>

  <style>
    #videoPopup {
      width: 100%;
      max-width: 600px;
      box-sizing: border-box;
      padding: 10px;
    }

    #gbVideo {
      width: 100%;
      height: auto;
    }

    @keyframes pulse {
      0% {
        transform: translateX(-50%) scale(1);
      }

      50% {
        transform: translateX(-50%) scale(1.1);
      }

      100% {
        transform: translateX(-50%) scale(1);
      }
    }

    #watchBtn {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background-color: #ff4500;
      color: white;
      font-size: 16px;
      padding: 12px 20px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-family: sans-serif;
      z-index: 999;
      animation: pulse 2s infinite;
    }
  </style>
</head>

<body style="margin: 0; overflow: hidden;">

  <audio src="./assets/mp3/Just music audio.mp3" preload="auto"></audio>

  <!-- AR Scene -->
  <a-scene embedded arjs vr-mode-ui="enabled: false" renderer="antialias: true; alpha: true" cursor="rayOrigin: mouse">

    <!-- look at script -->
    <script src="https://unpkg.com/aframe-look-at-component@0.8.0/dist/aframe-look-at-component.min.js"></script>


    <!-- Lighting -->
    <a-entity light="type: ambient; intensity: 1"></a-entity>
    <a-entity light="type: directional; intensity: 0.5" position="0 1 1"></a-entity>


    <!-- Floating info panel (starts hidden) -->
    <a-entity id="infoPanel" visible="false" position="0 8 -1.2" look-at="[camera]">
      <a-plane width="1.5" height="0.7" color="#111" opacity="0.8" radius="0.05"></a-plane>
      <a-text id="infoText" value="This is the informational tab" align="center" color="#fff" width="1.4"
        position="0 18 1">
      </a-text>
    </a-entity>

    <!-- Marker with model and text container -->
    <a-marker type="pattern" url="./assets/gbMarker.patt">

      <a-entity id="text-container" position="0 2.5 0" look-at="[camera]"> </a-entity>


      <!-- Garbage Plate (scaled down and lowered) -->
      <a-entity id="gbPlate" class="clickable" gltf-model="./assets/gbPlate.gltf" scale="0.6 0.6 0.6" position="0 2 0"
        rotation="-45 0 0" gesture-detector gesture-handler>
      </a-entity>


      <!-- Ingredient models (positioned behind and above the plate, facing the camera) -->
      <a-text id="labelMac" value="Mac Salad" position="-1.5 5.2 -1.5" look-at="[camera]" color="white" width="2"
        visible="false"></a-text>
      <a-entity id="gbMac" class="clickable" gltf-model="./assets/single_cooked_macaroni/mac.gltf"
        scale="20.7 20.7 20.7" position="-1.5 4.45 -1.5" look-at="[camera]" visible="false"></a-entity>


      <a-text id="labelBurg" value="Burger" position="0 4.85 -1.5" look-at="[camera]" color="white" width="2"
        visible="false"></a-text>
      <a-entity id="gbBurg" class="clickable" gltf-model="./assets/burger/burger.gltf" scale="1.4 1.4 1.4"
        position="0 4.65 -1.5" look-at="[camera]" visible="false"></a-entity>


      <a-text id="labelFries" value="Fries" position="1.5 5.2 -1.5" look-at="[camera]" color="white" width="2"
        visible="false"></a-text>
      <a-entity id="gbFries" class="clickable" gltf-model="./assets/french_fries/fries.gltf" scale="0.05 0.05 0.05"
        position="1.5 4.45 -1.5" look-at="[camera]" visible="false"></a-entity>
    </a-marker>

    <!-- Camera -->
    <a-entity camera cursor="rayOrigin: mouse" raycaster="objects: .clickable"></a-entity>
  </a-scene>

  <!-- Message Box -->
  <div id="message" style="
    position: absolute;
    top: 10px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(0,0,0,0.7);
    color: white;
    padding: 10px 20px;
    border-radius: 8px;
    font-family: sans-serif;
    display: none;
    z-index: 999;">
    These are the primary ingredients of a Garbage Plate. Tap on any ingredient to learn more about it!
  </div>

  <!-- Watch Video Button -->
  <button onclick="window.open('video.html', '_blank')" style="
    position: absolute;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    background-color: #ff4500;
    color: white;
    font-size: 16px;
    padding: 12px 20px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-family: sans-serif;
    z-index: 999;">
    Watch one be made!
  </button>

  <!-- Intro Overlay -->
  <div id="introOverlay" style="
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    background: rgba(0,0,0,0.95);
    color: white;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    padding: 20px;
    z-index: 1000;
    font-family: sans-serif;
    transform: translateX(-20px);
  ">

    <h1 style="font-size: 2em; margin-bottom: 10px;">Welcome to the Garbage Plate AR Experience</h1>
    <p style="max-width: 600px; font-size: 1.1em; margin-bottom: 30px;">
      Explore Rochester’s most iconic dish in augmented reality. Tap the plate to learn more about each ingredient—and
      don’t forget to watch how it’s made!
    </p>
    <button id="startBtn" style="
  padding: 12px 20px;
  font-size: 16px;
  background: #ff4500;
  border: none;
  border-radius: 8px;
  color: white;
  cursor: pointer;
">
      Start
    </button>

  </div>



  <script src="./scripts/script.js"></script>
</body>

</html>
